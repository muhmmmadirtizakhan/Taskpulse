<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="shortcut icon" href="/fv.jpeg">

    <title>Registration Page</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <section>
        <div class="blur-bg"></div>
        
        <div class="register-container">
            <form id="registerForm" autocomplete="off">
                <div class="header">
                    <h2>Create Account</h2>
                    <p class="subtitle">Join our community today</p>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required autocomplete="off" id="registerUsername">
                    <label>Username</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required autocomplete="off" id="registerEmail">
                    <label>Email Address</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="new-password" id="registerPassword">
                    <label>Password</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="confirm_password" required autocomplete="new-password" id="registerConfirmPassword">
                    <label>Confirm Password</label>
                </div>

                <div class="terms-box">
                    <label class="checkbox-label">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
                    </label>
                </div>

                <button type="submit" class="register-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <div class="login-link">
                    <p>Already have an account? <a href="login.html">Sign In</a></p>
                </div>
            </form>
        </div>
        
        <div class="floating-elements">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBX3OonJ08IK7egsDJv2TuZfhveTSV7NmA",
            authDomain: "taskpulse-41edb.firebaseapp.com",
            projectId: "taskpulse-41edb",
            storageBucket: "taskpulse-41edb.firebasestorage.app",
            messagingSenderId: "122473516709",
            appId: "1:122473516709:web:ca6bd67fa004fe483b074c",
            measurementId: "G-P18NQ6S57S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("registerForm");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const username = document.getElementById("registerUsername").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("registerConfirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match ❌");
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    return updateProfile(userCredential.user, {
                        displayName: username
                    });
                })
                .then(() => {
                    alert("Account created successfully 🎉");
                    window.location.href = "userinterface.html";
                })
                .catch((error) => {
                    alert(error.message);
                });
        });
    </script>
</body>
</html>
